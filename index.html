<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitación de Boda</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #f5f3ff;
        background:
          radial-gradient(circle at 20% 20%, #4c1d95 0%, transparent 35%),
          radial-gradient(circle at 80% 10%, #1d4ed8 0%, transparent 35%),
          radial-gradient(circle at 50% 80%, #0f172a 10%, #020617 60%, #000 100%);
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(#fff 1px, transparent 1px),
          radial-gradient(#c4b5fd 1px, transparent 1px);
        background-size: 28px 28px, 44px 44px;
        background-position: 0 0, 18px 20px;
        opacity: 0.45;
        pointer-events: none;
      }

      .card {
        width: min(90vw, 700px);
        padding: 2rem;
        border-radius: 20px;
        background: rgba(2, 6, 23, 0.7);
        border: 1px solid rgba(167, 139, 250, 0.4);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.8rem, 4vw, 2.8rem);
      }

      p {
        margin: 0;
        line-height: 1.65;
        font-size: clamp(1rem, 2.4vw, 1.2rem);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Invitación de Boda</h1>
      <p>
        Esas son de las cosas que tiene que decir. Nos encantaría que nos
        acompañes en este día tan especial, bajo un fondo inspirado en el
        universo.
      </p>
    </main>
  </body>
</html>
